global
    log stdout format raw local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 2s
    timeout client  30s
    timeout server  30s
    retries 2

frontend vault_front
    bind *:8200
    default_backend vault_cluster

backend vault_cluster
    mode http
    balance roundrobin
    option httpchk GET /v1/sys/health
    http-check expect status 200
    default-server inter 500ms fall 2 rise 2
    server vault-1 vault-1:8200 check
    server vault-2 vault-2:8200 check
    server vault-3 vault-3:8200 check

listen stats
    bind *:8209
    stats enable
    stats uri /stats
    stats refresh 2s
