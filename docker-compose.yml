services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cryptoshred-net

  # ── HashiCorp Vault 3-Node Raft HA Cluster ──────────────────────────────
  # Primary Leader Node on port 8200 (backward compatible for dev & single-node mode)
  vault-1:
    image: hashicorp/vault:1.13.3
    container_name: vault-1
    hostname: vault-1
    restart: always
    ports:
      - "${VAULT_PORT:-8200}:8200"
      - "8201:8201"
    environment:
      VAULT_DEV_ROOT_TOKEN: "${VAULT_DEV_ROOT_TOKEN}"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://vault-1:8200"
      VAULT_CLUSTER_ADDR: "http://vault-1:8201"
      VAULT_LOCAL_CONFIG: >
        {
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-1"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "telemetry": {
            "prometheus_retention_time": "30s",
            "disable_hostname": true
          },
          "default_lease_ttl": "720h",
          "max_lease_ttl": "8760h",
          "ui": true,
          "disable_mlock": false
        }
    volumes:
      - vaultdata-1:/vault/file
      - ./vault/config:/vault/config:ro
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
    entrypoint: ["/vault/entrypoint.sh"]
    cap_add:
      - IPC_LOCK
    networks:
      cryptoshred-net:
        aliases:
          - vault
          - vault-1

  vault-2:
    image: hashicorp/vault:1.13.3
    container_name: vault-2
    hostname: vault-2
    restart: always
    ports:
      - "8202:8200"
      - "8203:8201"
    environment:
      VAULT_DEV_ROOT_TOKEN: "${VAULT_DEV_ROOT_TOKEN}"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://vault-2:8200"
      VAULT_CLUSTER_ADDR: "http://vault-2:8201"
      VAULT_LOCAL_CONFIG: >
        {
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-2"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "telemetry": {
            "prometheus_retention_time": "30s",
            "disable_hostname": true
          },
          "default_lease_ttl": "720h",
          "max_lease_ttl": "8760h",
          "ui": true,
          "disable_mlock": false
        }
    volumes:
      - vaultdata-2:/vault/file
      - ./vault/config:/vault/config:ro
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
    entrypoint: ["/vault/entrypoint.sh"]
    cap_add:
      - IPC_LOCK
    networks:
      cryptoshred-net:
        aliases:
          - vault-2

  vault-3:
    image: hashicorp/vault:1.13.3
    container_name: vault-3
    hostname: vault-3
    restart: always
    ports:
      - "8204:8200"
      - "8205:8201"
    environment:
      VAULT_DEV_ROOT_TOKEN: "${VAULT_DEV_ROOT_TOKEN}"
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://vault-3:8200"
      VAULT_CLUSTER_ADDR: "http://vault-3:8201"
      VAULT_LOCAL_CONFIG: >
        {
          "storage": {
            "raft": {
              "path": "/vault/file",
              "node_id": "vault-3"
            }
          },
          "listener": [{
            "tcp": {
              "address": "0.0.0.0:8200",
              "cluster_address": "0.0.0.0:8201",
              "tls_disable": true
            }
          }],
          "telemetry": {
            "prometheus_retention_time": "30s",
            "disable_hostname": true
          },
          "default_lease_ttl": "720h",
          "max_lease_ttl": "8760h",
          "ui": true,
          "disable_mlock": false
        }
    volumes:
      - vaultdata-3:/vault/file
      - ./vault/config:/vault/config:ro
      - ./vault/entrypoint.sh:/vault/entrypoint.sh:ro
    entrypoint: ["/vault/entrypoint.sh"]
    cap_add:
      - IPC_LOCK
    networks:
      cryptoshred-net:
        aliases:
          - vault-3

  # ── Backend Application Container (Optional containerized profile) ───────
  backend:
    build:
      context: ./backend
    container_name: cryptoshred_backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_VAULT_HOST: vault-1
      SPRING_VAULT_PORT: 8200
      SPRING_VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN}
      SPRING_VAULT_SCHEME: http
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET}
    cap_add:
      - IPC_LOCK
    depends_on:
      - db
      - vault-1
      - kafka
      - redis
    networks:
      - cryptoshred-net
    profiles:
      - all
      - app

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_event_log
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 8760
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - cryptoshred-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    restart: always
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: health-system-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - cryptoshred-net

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cryptoshred-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - cryptoshred-net

  # ── Distributed Observability & Monitoring Stack ────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      cryptoshred-net:
        aliases:
          - prometheus
    profiles:
      - monitoring
      - all

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      cryptoshred-net:
        aliases:
          - grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - all

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      cryptoshred-net:
        aliases:
          - postgres-exporter
          - postgres_exporter
    depends_on:
      - db
    profiles:
      - monitoring
      - all

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      cryptoshred-net:
        aliases:
          - redis-exporter
          - redis_exporter
    depends_on:
      - redis
    profiles:
      - monitoring
      - all

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka_exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka:29092"]
    networks:
      cryptoshred-net:
        aliases:
          - kafka-exporter
          - kafka_exporter
    depends_on:
      - kafka
    profiles:
      - monitoring
      - all

volumes:
  pgdata:
  vaultdata:
  vaultdata-1:
  vaultdata-2:
  vaultdata-3:

networks:
  cryptoshred-net:
    name: cryptoshred-net
    driver: bridge