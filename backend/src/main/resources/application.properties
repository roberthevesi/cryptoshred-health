spring.application.name=cryptoshred-health

# ── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:healthdb}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# DEV ONLY — auto-updates schema on startup. Use 'validate' or Flyway migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Vault KMS ────────────────────────────────────────────────────────────────
spring.vault.host=localhost
spring.vault.port=${VAULT_PORT:8200}
spring.vault.token=${VAULT_DEV_ROOT_TOKEN}
# DEV ONLY — Vault is running in dev mode over HTTP. Switch to https with TLS in production.
spring.vault.scheme=http
spring.vault.authentication=TOKEN

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cryptoshred-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.retention-ms=${KAFKA_RETENTION_MS:31536000000}

# ── Redis ────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.redis.time-to-live-ms=${REDIS_TTL_MS:900000}

# ── WORM Backup Exporter ────────────────────────────────────────────────────
backup.worm.directory=${WORM_BACKUP_DIR:backups/worm}
backup.worm.cron=${WORM_BACKUP_CRON:0 0 0 * * *}

# ── Atomic Coordinated Backup & Disaster Recovery ──────────────────────────
backup.bundle.directory=${BACKUP_BUNDLE_DIR:backups/bundles}
backup.bundle.cron=${BACKUP_BUNDLE_CRON:0 0 2 * * *}
backup.tombstone.cron=${BACKUP_TOMBSTONE_CRON:0 0 */6 * * *}


