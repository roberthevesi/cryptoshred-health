spring.application.name=cryptoshred-health

# ── DataSource ──────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/healthdb
spring.datasource.username=root
spring.datasource.password=toor
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────────────────────
# 256-bit base64-encoded secret (do NOT commit real secrets to VCS)
app.jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIEpXVCBzaWduaW5n
app.jwt.expiration-ms=86400000

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Vault KMS ────────────────────────────────────────────────────────────────
spring.vault.host=localhost
spring.vault.port=8200
spring.vault.token=root
spring.vault.scheme=http
spring.vault.authentication=TOKEN

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cryptoshred-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

